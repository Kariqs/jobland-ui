<header class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200/50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 md:h-20">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-linear-to-br from-blue-600 to-purple-600 flex items-center justify-center font-bold text-white text-xl shadow-lg">
                    J
                </div>
                <span class="text-2xl md:text-3xl font-extrabold text-gray-800">
                    JoblandsAI
                </span>
            </div>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center gap-10 text-gray-600">
                <a href="#" class="hover:text-gray-900 transition-colors">Pricing</a>
                <a href="#" class="hover:text-gray-900 transition-colors">Pricing</a>
                <a href="#" class="hover:text-gray-900 transition-colors">About</a>
            </nav>

            <!-- Desktop Auth Buttons -->
            <div class="hidden md:flex items-center gap-4">
                <button class="px-5 py-2 text-gray-600 hover:text-gray-900 transition-colors">
                    Sign In
                </button>
                <button
                    class="px-6 py-2.5 bg-linear-to-r from-blue-600 to-purple-600 text-white rounded-full font-medium hover:shadow-lg hover:shadow-blue-500/30 transition-all">
                    Get Started
                </button>
            </div>

            <!-- Hamburger Button (Mobile) -->
            <button
                class="md:hidden text-gray-800 p-2 rounded-lg hover:bg-gray-100 transition-colors focus:outline-none"
                (click)="toggleMenu()" aria-label="Toggle menu">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        [attr.d]="isMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden bg-white/95 border-t border-gray-200/50">
        <div class="px-6 py-8 space-y-6">
            <a href="#" class="block text-lg text-gray-600 hover:text-gray-900 transition-colors">
                For Job Seekers
            </a>
            <a href="#" class="block text-lg text-gray-600 hover:text-gray-900 transition-colors">
                For Employers
            </a>
            <a href="#" class="block text-lg text-gray-600 hover:text-gray-900 transition-colors">
                Pricing
            </a>
            <div class="pt-6 space-y-4">
                <button
                    class="w-full py-3 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    Sign In
                </button>
                <button
                    class="w-full py-3 bg-linear-to-r from-blue-600 to-purple-600 text-white rounded-lg font-medium hover:shadow-lg transition-all">
                    Get Started
                </button>
            </div>
        </div>
    </div>
</header>
